<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifying Sign-In... - Pawfect Glow</title>
  <link rel="stylesheet" href="/css/style.css">
  <!-- Clerk JavaScript SDK -->
  <script 
    async 
    crossorigin="anonymous" 
    data-clerk-publishable-key="pk_test_c3RpbGwtc3dhbi05NTc0LmNsZXJrLmFjY291bnRzLmRldiQ" 
    src="https://still-swan-9574.clerk.accounts.dev/npm/@clerk/clerk-js@latest/dist/clerk.browser.js" 
    type="text/javascript"
  ></script>
  <script src="/js/auth.js"></script>
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--color-bg); font-family: var(--font-body); margin: 0;">
  <div style="text-align: center; padding: 48px 32px; background: white; border-radius: var(--radius-xl); box-shadow: var(--shadow-lg); max-width: 440px; width: 90%; border: 1px solid var(--color-border);">
    <div style="font-size: 3.5rem; margin-bottom: 16px; animation: pulse 1.2s infinite ease-in-out;">🐾</div>
    <h2 style="font-size: 1.5rem; margin-bottom: 8px; color: var(--color-primary);">Completing Sign-In</h2>
    <p style="color: var(--color-text-muted); font-size: 0.95rem; margin-bottom: 24px;">Authenticating with Google and securing your session...</p>
    <div style="display: inline-block; width: 36px; height: 36px; border: 3px solid rgba(28, 61, 49, 0.15); border-top-color: var(--color-primary); border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
  </div>

  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
  </style>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      let redirected = false;
      const finish = () => {
        if (!redirected) {
          redirected = true;
          window.location.replace('/dashboard.html');
        }
      };

      // Safety timeout: guaranteed navigation to dashboard within 3.5s
      const timeoutId = setTimeout(finish, 3500);

      try {
        const clerk = await initClerk();

        const doSync = async () => {
          const u = clerk ? (clerk.user || clerk.session?.user || clerk.client?.sessions?.[0]?.user) : null;
          if (u) {
            const email = u.primaryEmailAddress?.emailAddress || u.emailAddresses?.[0]?.emailAddress || '';
            const name = u.fullName || u.firstName || 'Pet Parent';
            const clerkId = u.id;

            if (email) {
              const res = await fetch('/api/auth/sso-sync', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ clerkId, name, email })
              });

              const data = await res.json();
              if (res.ok && data.success && data.token) {
                localStorage.setItem('pet_grooming_token', data.token);
                localStorage.setItem('pet_grooming_user', JSON.stringify(data.user));
              }
            }
          }
        };

        if (clerk && typeof clerk.handleRedirectCallback === 'function') {
          await clerk.handleRedirectCallback({
            afterSignInUrl: '/dashboard.html',
            afterSignUpUrl: '/dashboard.html'
          }, async () => {
            // customNavigate: Clerk sets session first, then we sync before redirecting
            await doSync();
            clearTimeout(timeoutId);
            finish();
          });
        }

        // Sync in case handleRedirectCallback finished without invoking customNavigate
        await doSync();
      } catch (err) {
        console.error('SSO Callback error:', err);
      }

      clearTimeout(timeoutId);
      finish();
    });
  </script>
</body>
</html>
