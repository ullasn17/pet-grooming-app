<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Pawfect Glow Pet Grooming</title>
  <link rel="stylesheet" href="/css/style.css">
  <!-- Clerk JavaScript SDK -->
  <script 
    async 
    crossorigin="anonymous" 
    data-clerk-publishable-key="pk_test_c3RpbGwtc3dhbi05NTc0LmNsZXJrLmFjY291bnRzLmRldiQ" 
    src="https://still-swan-9574.clerk.accounts.dev/npm/@clerk/clerk-js@latest/dist/clerk.browser.js" 
    type="text/javascript"
  ></script>
  <script src="/js/auth.js"></script>
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="/" class="brand-logo">
        <div class="logo-icon">🐾</div>
        <span>Pawfect<span class="accent">Glow</span></span>
      </a>
      <div id="navActions" class="nav-actions">
        <a href="/login.html" class="btn btn-outline btn-sm">Sign In</a>
      </div>
    </div>
  </nav>

  <!-- Sign Up Main Content -->
  <main class="auth-page">
    <div class="auth-card" style="max-width: 480px;">
      <div class="auth-header">
        <span class="auth-badge">Join The Family</span>
        <h1>Create Account</h1>
        <p>Start your pet's wellness journey with Google or email</p>
      </div>

      <!-- Prominent Google SSO Direct Button -->
      <button 
        type="button" 
        id="googleSsoBtn" 
        class="btn btn-outline btn-block" 
        style="padding: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 12px; border-radius: var(--radius-md); background: #ffffff; border: 1px solid var(--color-border); box-shadow: var(--shadow-sm); margin-bottom: 24px;"
      >
        <!-- Official Google SVG Icon -->
        <svg width="20" height="20" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Sign Up with Google</span>
      </button>

      <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 24px;">
        <div style="flex: 1; height: 1px; background: var(--color-border);"></div>
        <span style="font-size: 0.8rem; color: var(--color-text-light); text-transform: uppercase; letter-spacing: 0.06em;">or register with email</span>
        <div style="flex: 1; height: 1px; background: var(--color-border);"></div>
      </div>

      <div id="signupAlert" style="display: none; padding: 12px; border-radius: var(--radius-md); font-size: 0.9rem; margin-bottom: 20px;"></div>

      <form id="signupForm" autocomplete="on">
        <div class="form-group">
          <label class="form-label" for="name">Your Full Name</label>
          <div class="input-wrapper">
            <input 
              type="text" 
              id="name" 
              name="name" 
              class="form-input" 
              placeholder="e.g. Sarah Jenkins" 
              required 
              autocomplete="name"
            >
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <div class="input-wrapper">
            <input 
              type="email" 
              id="email" 
              name="email" 
              class="form-input" 
              placeholder="you@example.com" 
              required 
              autocomplete="email"
            >
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Create Password</label>
          <div class="input-wrapper">
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="form-input" 
              placeholder="Minimum 6 characters" 
              minlength="6"
              required 
              autocomplete="new-password"
            >
            <button type="button" class="password-toggle" id="togglePassword" aria-label="Toggle password visibility">👁️</button>
          </div>
          <span class="form-hint">Must contain at least 6 characters.</span>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="signupBtn" style="margin-top: 10px;">
          <span>Create Account</span>
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="/login.html">Sign in here</a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-content">
      <p>© 2026 Pawfect Glow Pet Grooming Studio. Protected by Clerk Authentication.</p>
    </div>
  </footer>

  <script>
    // Google SSO Click Handler
    document.getElementById('googleSsoBtn').addEventListener('click', async () => {
      loginWithGoogle();
    });

    // Password visibility toggle
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    togglePassword.addEventListener('click', () => {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
      togglePassword.textContent = isPassword ? '🙈' : '👁️';
    });

    // Sign Up Form Submission
    const signupForm = document.getElementById('signupForm');
    const signupBtn = document.getElementById('signupBtn');
    const signupAlert = document.getElementById('signupAlert');

    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (password.length < 6) {
        signupAlert.style.display = 'block';
        signupAlert.style.background = 'var(--color-warning-bg)';
        signupAlert.style.color = '#c53030';
        signupAlert.style.border = '1px solid #feb2b2';
        signupAlert.textContent = 'Password must be at least 6 characters long.';
        return;
      }

      signupBtn.disabled = true;
      signupBtn.innerHTML = '<span>Creating account...</span>';
      signupAlert.style.display = 'none';

      try {
        // Direct server sign up with MongoDB
        const response = await fetch('/api/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          localStorage.setItem('pet_grooming_token', data.token);
          localStorage.setItem('pet_grooming_user', JSON.stringify(data.user));
          showToast('Account created successfully! Welcome aboard 🐾', 'success');
          window.location.replace('/dashboard.html');
          return;
        } else {
          signupAlert.style.display = 'block';
          signupAlert.style.background = 'var(--color-warning-bg)';
          signupAlert.style.color = '#c53030';
          signupAlert.style.border = '1px solid #feb2b2';
          signupAlert.textContent = data.message || 'Registration failed. Please check your details.';
        }
      } catch (err) {
        console.error('Signup error:', err);
        signupAlert.style.display = 'block';
        signupAlert.style.background = 'var(--color-warning-bg)';
        signupAlert.style.color = '#c53030';
        signupAlert.style.border = '1px solid #feb2b2';
        signupAlert.textContent = 'Unable to connect to server. Please try again.';
      } finally {
        signupBtn.disabled = false;
        signupBtn.innerHTML = '<span>Create Account</span>';
      }
    });
  </script>
</body>
</html>
